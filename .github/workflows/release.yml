name: release

# Publish to crates.io when a GitHub Release is published, with crates.io
# trusted publishing (OIDC): configure it once on crates.io (crate lm15 →
# Settings → Trusted Publishing: GitHub, lm15-dev/lm15-rs, workflow
# release.yml, environment crates-io). No token is stored anywhere.
# RELEASING.md has the whole procedure.

on:
  release:
    types: [published]

permissions: {}

env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Tag matches Cargo.toml
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME does not match crate version $VERSION"; exit 1; }
      - name: Check out pinned contract
        run: |
          PIN=$(tr -d '[:space:]' < CONTRACT_PIN)
          git clone --no-checkout https://github.com/lm15-dev/lm15-contract.git ../lm15-contract
          git -C ../lm15-contract checkout --detach "$PIN"
      - run: cargo test --locked --no-fail-fast
      - run: cargo build --locked --release --bin lm15-vet
      - run: python3 ../lm15-contract/harness/check.py --shim rust --direction all

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/lm15
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
