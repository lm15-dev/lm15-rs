name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  test:
    # Every test target (the corpus tests read ../lm15-contract at CONTRACT_PIN)
    # on the three desktop/server OSes.
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Check out pinned contract
        run: |
          PIN=$(tr -d '[:space:]' < CONTRACT_PIN)
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid CONTRACT_PIN'; exit 1; }
          git clone --no-checkout https://github.com/lm15-dev/lm15-contract.git ../lm15-contract
          git -C ../lm15-contract checkout --detach "$PIN"
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      # --no-fail-fast: every failing target is reported, not only the first.
      - run: cargo test --locked --no-fail-fast
      - name: Blocking API
        run: cargo test --locked --features blocking --no-fail-fast --lib

  wasm:
    # Default features off: the wire codec alone, for the browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: wasm-ld from the toolchain (tools/wasm-ld uses the one on PATH)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld" "$RUNNER_TEMP/bin/wasm-ld"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo build --locked --lib --no-default-features --features wasm --target wasm32-unknown-unknown

  contract:
    # The shared harness sandboxes the shim with Linux's `unshare -rn`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Check out pinned contract
        run: |
          PIN=$(tr -d '[:space:]' < CONTRACT_PIN)
          git clone --no-checkout https://github.com/lm15-dev/lm15-contract.git ../lm15-contract
          git -C ../lm15-contract checkout --detach "$PIN"
      - run: cargo build --locked --release --bin lm15-vet
      - name: Contract harness (every direction, at the pin)
        run: python3 ../lm15-contract/harness/check.py --shim rust --direction all

  package:
    # What crates.io would receive, built on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo publish --locked --dry-run
