[package]
name = "lm15"
version = "0.2.0"
edition = "2021"
description = "lm15 canonical model, Rust port — implemented from the lm15-contract spec."
license = "MIT"
repository = "https://github.com/lm15-dev/lm15-rs"
keywords = ["llm", "openai", "anthropic", "gemini", "ai"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-tls = "0.2"

[[bin]]
name = "lm15-vet"
path = "src/bin/vet.rs"
